<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FEFAF0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Momotaro and the Oni</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════
       SCREEN: HOME
  ═══════════════════════════════════════════ -->
  <div class="screen active" id="screen-home">
    <div class="home-logo">
      <span class="logo-text">⚪ momotaro</span>
    </div>
    <div class="home-title">
      <h1 class="title-line1">MOMOTARO</h1>
      <h1 class="title-line2">AND THE <span class="title-oni">ONI</span></h1>
    </div>
    <div class="grade-grid">
      <button class="grade-btn grade-3" data-grade="3">Grade 3</button>
      <button class="grade-btn grade-4" data-grade="4">Grade 4</button>
      <button class="grade-btn grade-5" data-grade="5">Grade 5</button>
      <button class="grade-btn grade-6" data-grade="6">Grade 6</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       SCREEN: UNIT SELECTION + TEAMS
  ═══════════════════════════════════════════ -->
  <div class="screen" id="screen-setup">
    <div class="setup-topbar">
      <button class="nav-btn" id="setup-back">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 15L7 10L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="setup-grade-label" id="setup-grade-label">Grade 3</span>
      <button class="nav-btn expand-btn" id="setup-expand">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 8V3h5M17 8V3h-5M3 12v5h5M17 12v5h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="setup-body">
      <!-- Teams selector -->
      <div class="teams-row">
        <span class="teams-label">Teams</span>
        <div class="teams-toggle">
          <button class="team-count-btn active" data-count="2">2</button>
          <button class="team-count-btn" data-count="3">3</button>
          <button class="team-count-btn" data-count="4">4</button>
        </div>
      </div>

      <!-- Unit grid -->
      <div class="units-panel">
        <div class="units-panel-header">
          <span class="units-panel-title">Units</span>
          <span class="units-selected-count" id="units-selected-count">0 selected</span>
        </div>
        <div class="unit-grid" id="unit-grid">
          <!-- Populated by data.js -->
        </div>
      </div>

      <button class="launch-btn" id="launch-btn" disabled>Launch</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       SCREEN: SCOREBOARD
  ═══════════════════════════════════════════ -->
  <div class="screen" id="screen-scoreboard">
    <div class="scoreboard-topbar">
      <button class="nav-btn" id="scoreboard-back">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 15L7 10L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="nav-btn expand-btn" id="scoreboard-expand">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 8V3h5M17 8V3h-5M3 12v5h5M17 12v5h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="scoreboard-columns" id="scoreboard-columns">
      <!-- Populated by scoreboard.js -->
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       SCREEN: QUESTION
  ═══════════════════════════════════════════ -->
  <div class="screen" id="screen-question">
    <div class="question-topbar">
      <span class="question-team-label" id="question-team-label">Team 1 – Please answer</span>
    </div>

    <div class="question-body">
      <!-- Left column: Q&A card + buttons -->
      <div class="question-left">
        <div class="question-card">
          <div class="question-qa">
            <div class="question-q">
              <span class="qa-letter q-letter">Q</span>
              <span class="qa-text" id="question-text">What's the weather like?</span>
            </div>
            <div class="question-a">
              <span class="qa-letter a-letter">A</span>
              <span class="qa-text qa-scaffold" id="question-scaffold">It's ...</span>
            </div>
          </div>
        </div>

        <!-- Type C: skit dialogue (left column only) -->
        <div class="question-skit-wrap hidden" id="question-skit-wrap">
          <div class="question-skit" id="question-skit"></div>
        </div>

        <div class="question-actions">
          <button class="question-btn btn-secondary" id="question-new">New Question</button>
          <button class="question-btn btn-primary" id="question-play">Play Card Game</button>
        </div>
      </div>

      <!-- Right column: image or helper bubbles -->
      <div class="question-right">
        <!-- Type A: single image -->
        <div class="question-image-wrap" id="question-image-wrap">
          <img id="question-image" src="" alt="" />
        </div>

        <!-- Type B: bubble/grid helper images -->
        <div class="question-bubbles-wrap hidden" id="question-bubbles-wrap">
          <div class="question-bubbles" id="question-bubbles"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       SCREEN: CARD GAME (9 tiles)
  ═══════════════════════════════════════════ -->
  <div class="screen" id="screen-cardgame">
    <div class="cardgame-topbar">
      <span class="cardgame-team-label" id="cardgame-team-label">Team 1 – Choose some cards!</span>
    </div>

    <div class="cardgame-body">
      <div class="tile-grid" id="tile-grid">
        <!-- 9 tiles populated by cardgame.js -->
      </div>

      <div class="cardgame-panel">
        <div class="panel-label">Round Points</div>
        <div class="panel-center">
          <div class="panel-points-zone">
            <div class="round-points" id="round-points">+0</div>
          </div>
          <div class="panel-omamori-zone">
            <div id="cardgame-omamori-row"></div>
          </div>
        </div>
        <div class="panel-scores" id="cardgame-scores"></div>
        <button class="keep-btn" id="keep-btn">Keep!</button>
      </div>    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       SCREEN: RARE CARD GAME (4 tiles)
  ═══════════════════════════════════════════ -->
  <div class="screen" id="screen-rare">
    <div class="rare-topbar">
      <span class="rare-team-label" id="rare-team-label">Team 1 – Choose 1 rare card!</span>
    </div>

    <div class="rare-body">
      <div class="rare-grid" id="rare-grid">
        <!-- 4 tiles populated by rare.js -->
      </div>

      <div class="rare-panel" id="rare-panel">
        <!-- Result revealed here: points / omamori / swap UI -->
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       OVERLAY: ONI RESULT
  ═══════════════════════════════════════════ -->
  <div class="overlay hidden" id="overlay-oni">
    <div class="oni-modal">
      <div class="oni-icon">👹</div>
      <div class="oni-title">ONI!</div>
      <div class="oni-subtitle" id="oni-subtitle">–10 points</div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/scoreboard.js"></script>
  <script src="js/question.js"></script>
  <script src="js/cardgame.js"></script>
  <script src="js/rare.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
